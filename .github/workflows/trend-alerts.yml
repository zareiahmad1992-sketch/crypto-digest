name: trend-alerts
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: 'Send a ping test'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: trend-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests jdatetime pyyaml
      - name: Run trend alerts
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          if [ "${{ github.event.inputs.ping }}" = "true" ]; then
            python trend_alerts.py --ping
          else
            python trend_alerts.py
            python futures_alerts.py --preview
          fi
      - name: Commit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/trend_state.json data/scenario_log.json data/run_log.json data/futures_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update trend state'
            git push
          fi
