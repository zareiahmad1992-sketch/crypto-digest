name: Daily Post

"on":
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:\n  group: crypto-state\n  cancel-in-progress: false\n\npermissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Create and send post
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python daily.py --pages 1
