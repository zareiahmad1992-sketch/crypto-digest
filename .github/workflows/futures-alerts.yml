name: Futures Alerts & Trade Reporter

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-state
  cancel-in-progress: false

jobs:
  scan-and-track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Test Exchange APIs from GitHub Runner
        run: |
          for name_url in \
            "BinanceFutures|https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1h&limit=2" \
            "BinanceVision|https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=2" \
            "OKX|https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=1H&limit=2" \
            "GateIO|https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=1h&limit=2" \
            "KuCoin|https://api-futures.kucoin.com/api/v1/kline/query?symbol=XBTUSDTM&granularity=60" \
            "Hyperliquid|https://api.hyperliquid.xyz/info"; do
            name="${name_url%%|*}"
            url="${name_url#*|}"
            if [ "$name" = "Hyperliquid" ]; then
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$url" -H "Content-Type: application/json" -d '{"type":"meta"}')
            else
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            fi
            echo "$name -> HTTP $code"
          done

      - name: Scan Top 40 Crypto & Track Trade Results
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python futures_alerts.py

      - name: Save State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update trade state and history [skip ci]" || echo "No state changes"
          git pull --rebase origin main
          git push origin main
